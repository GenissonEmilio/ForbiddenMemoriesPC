name: Native PC port

on:
  push:
    branches: [main, web-port, 'codex/**']
  pull_request:
    branches: [main, web-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native compiler and mod test toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang lld
      - uses: actions/cache@v4
        with:
          path: |
            tmp/pc/linux-sysroot
            tmp/pc/linux-sysroot-downloads
            tmp/pc/sdl-m32-portable
            tmp/pc/sdl-source
            tmp/pc/tools
          key: native-linux-${{ hashFiles('tools/pc/build_linux_sysroot.py', 'tools/pc/fetch_tools.py') }}
      - name: Build the complete native executable without a disc
        run: python tools/pc/build.py --target linux
      - name: Native packet ordering and mod cache regressions
        run: |
          python tools/pc/test_libgs_priority.py
          python tools/pc/test_mod_cache.py
      - name: Disc import regressions with synthetic data
        run: python -m unittest discover -s tests/pc -p test_disc_import.py -v
